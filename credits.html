    body {

      margin: 40px auto;
      background: #111;
      border: 4px double lime;
      padding: 25px;
      box-shadow: 0 0 12px lime;
    }

      font-size: 14px;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    ul {
      list-style-type: square;
      padding-left: 20px;
      font-size: 12px;
    }

    li {
      margin-bottom: 10px;
