<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      background: black url('https://www.transparenttextures.com/patterns/dark-mosaic.png');
      color: #00ff00;
      text-shadow: 1px 1px 1px black;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 30px 10px;
      background: #111;
      border-bottom: 4px solid lime;
    }

    .header h1 {
      font-size: 24px;
      color: #00ff00;
      margin: 0;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
      background: #222;
      border-top: 2px solid lime;
      border-bottom: 2px solid lime;
    }

    .nav a {
      color: lime;
      text-decoration: none;
      background: #000;
      padding: 8px 16px;
      border: 2px solid lime;
      display: inline-block;
    }

    .nav a:hover {
      background: lime;
      color: black;
    }

    #tintedBox {
      background-color: #111;
      border: 4px double lime;
      padding: 25px;
      max-width: 600px;
      margin: 40px auto 20px;
      text-align: center;
      box-shadow: 0 0 12px lime;
    }

    #message {
      margin-top: 20px;
      color: #00ff00;
    }

    .visit-button-wrapper {
      margin-top: 20px;
      display: none;
    }

    .visit-button {
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: lime;
      border: 2px solid lime;
      padding: 12px 20px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .visit-button:hover {
      background: lime;
      color: black;
    }

    .news-section {
      background-color: #111;
      border: 4px dashed lime;
      padding: 20px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 0 10px lime;
    }

    .news-section h2 {
      font-size: 16px;
      color: lime;
      margin-bottom: 15px;
    }

    .news-section p {
      font-size: 12px;
      line-height: 1.5;
      color: #00ff00;
    }

    .footer {
      background: #111;
      color: lime;
      text-align: center;
      padding: 20px;
      border-top: 4px solid lime;
      font-size: 10px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  
  <div class="header">
    <h1>TrollStatus</h1>
  </div>

  
  <div class="nav">
    <a href="#">FAQ</a>
    <a href="#">Credits</a>
    <a href="https://reddit.com/r/jailbreak" target="_blank">Reddit</a>
  </div>

  
  <div id="tintedBox">
    <h2>Welcome to TrollStatus</h2>
    <p id="message">Detecting your device...</p>
    <div class="visit-button-wrapper" id="visitButton">
      <a class="visit-button" href="https://ios.cfw.guide" target="_blank">Visit ios.cfw.guide</a>
    </div>
  </div>

  
  <div class="news-section">
    <h2>News</h2>
    <p>July 14, 2025 – TrollStatus is live! More features like firmware-specific guides, OTA checkers and local notifications coming soon!</p>
    <p>Stay tuned for updates.</p>
  </div>

  
  <div class="footer">
    Made in Finland 🇫🇮
  </div>

  
  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        const userAgent = navigator.userAgent;
        let message = '';
        let showGuideButton = false;

        if (/iPhone|iPad|iPod/.test(userAgent)) {
          const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
          if (match) {
            const major = parseInt(match[1], 10);
            const minor = parseInt(match[2] || 0, 10);
            const patch = parseInt(match[3] || 0, 10);

            if (major === 16 && minor <= 5) {
              message = "iOS 16.5 or lower detected. Jailbreak time!";
              showGuideButton = true;
            } else if (major === 16 && minor === 5 && patch <= 1) {
              message = "iOS 16.5.1 – Use NathanLR.";
              showGuideButton = true;
            } else if (major === 16 && minor === 6 && patch <= 1) {
              message = "iOS 16.6–16.6.1 – Use NathanLR.";
              showGuideButton = true;
            } else if (major === 16 && minor === 7 && patch <= 10) {
              message = "iOS 16.7–16.7.10 – Checkm8 might work!";
              showGuideButton = true;
            } else if (major === 17 && minor === 0) {
              message = "iOS 17.0 – Compatible with TrollStore!";
              showGuideButton = true;
            } else {
              message = "iOS version may not be jailbreakable.";
            }
          } else {
            message = "iOS version not recognized.";
          }
        } else {
          message = "Not an iOS device!";
        }

        document.getElementById('message').innerText = message;
        if (showGuideButton) {
          document.getElementById('visitButton').style.display = 'block';
        }
      }, 1000);
    }

    window.onload = detectIOSVersion;
  </script>

</body>
</html>
