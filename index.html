<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@200;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fira Sans Condensed', sans-serif;
      height: 100vh;
      background: linear-gradient(270deg, #0a3bc9, #383a41);
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2.5rem;
      font-weight: 500;
    }

    nav {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      cursor: pointer;
      position: relative;
      z-index: 1;
    }

    .dropbtn::before {
      content: "";
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 30px;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
      z-index: -1;
      filter: blur(8px);
      animation: pulse 3s infinite linear;
    }

    @keyframes pulse {
      0% { filter: blur(6px); opacity: 0.8; }
      50% { filter: blur(12px); opacity: 1; }
      100% { filter: blur(6px); opacity: 0.8; }
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: rgba(0, 0, 0, 0.8);
      min-width: 180px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: fadeIn 0.3s ease forwards;
    }

    .dropdown-content a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      transition: background 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    #tintedBox {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 25px;
      width: 85%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      margin-top: 80px;
    }

    #image {
      border-radius: 35%;
      width: 150px;
      height: 150px;
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .visit-button {
      display: none;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    .visit-button:hover {
      background-color: #0056b3;
    }

    .footer-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="title">TrollStatus</div>

  <nav>
    <div class="dropdown">
      <button class="dropbtn">Menu</button>
      <div class="dropdown-content">
        <a href="faq.html">FAQ</a>
        <a href="credits.html">Credits</a>
      </div>
    </div>
  </nav>

  <div id="tintedBox">
    <img id="image" alt="Trollface" />
    <div id="message"></div>
    <button id="visitButton" class="visit-button" onclick="window.location.href='https://ios.cfw.guide'">Visit ios.cfw.guide</button>
  </div>

  <div class="footer-text">Made in Finland</div>

  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        try {
          const userAgent = navigator.userAgent;
          let message = '';

          if (/iPhone|iPad|iPod/.test(userAgent)) {
            const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
            if (match) {
              const major = parseInt(match[1], 10);
              const minor = parseInt(match[2] || 0, 10);
              const patch = parseInt(match[3] || 0, 10);

              if (major === 16 && minor <= 5) {
                message = "Your device is on iOS 16.5 or lower, so it's jailbreak time! Check ios.cfw.guide for instructions.";
                document.getElementById('image').src = 'Trollface.jpg';
                document.getElementById('image').style.display = 'inline';
              } else if (major === 16 && minor === 5 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.5.1";
              } else if (major === 16 && minor === 6 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.6–16.6.1";
              } else if (major === 16 && minor === 7 && patch <= 10) {
                message = "You're on iOS 16.7–16.7.10, which is also jailbreakable if you're using a Checkm8 device!";
              } else if (major === 17 && minor === 0) {
                message = "Your device seems to be compatible with TrollStore. Go to ios.cfw.guide for more information about installing TrollStore.";
              } else if (major > 17 || (major === 16 && minor > 7)) {
                message = "Your iOS-version is too new to be jailbroken :(";
              }
            } else {
              message = "Oops! Your device was not recognised.";
            }
          } else {
            message = "You're not using an iOS device!";
          }

          document.getElementById('message').innerText = message;
          document.getElementById('message').style.opacity = 1;
          document.getElementById('visitButton').style.display = 'inline-block';

        } catch (error) {
          console.error("An error occurred while detecting the iOS version:", error);
          document.getElementById('message').innerText = "An error occurred while detecting your device.";
        }
      }, 1500);
    }

    window.onload = detectIOSVersion;
  </script>

</body>
</html>
