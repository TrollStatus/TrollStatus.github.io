<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-color: #0a3bc9;
      --bg-color-end: #383a41;
      --text-color: white;
      --box-bg: rgba(255, 255, 255, 0.08);
      --dropdown-bg: rgba(0, 0, 0, 0.65);
    }

    body.light {
      --bg-color: #ffffff;
      --bg-color-end: #e0e0e0;
      --text-color: #111;
      --box-bg: rgba(0, 0, 0, 0.05);
      --dropdown-bg: rgba(255, 255, 255, 0.65);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fira Sans Condensed', sans-serif;
      height: 100vh;
      background: linear-gradient(270deg, var(--bg-color), var(--bg-color-end));
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2.5rem;
      font-weight: 500;
    }

  
    .menu-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 100;
    }

    .bar {
      height: 4px;
      width: 100%;
      background-color: var(--text-color);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .menu.open + .menu-btn .bar:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .menu.open + .menu-btn .bar:nth-child(2) {
      opacity: 0;
    }

    .menu.open + .menu-btn .bar:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    .menu {
      position: fixed;
      top: 0;
      right: -320px;
      width: 280px;
      height: 100vh;
      background-color: var(--dropdown-bg);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      transition: right 0.4s ease;
      z-index: 101;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
    }

    .menu.open {
      right: 0;
    }

    .menu .theme-toggle {
      align-self: flex-start;
      font-size: 22px;
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      margin-bottom: 30px;
    }

    .menu a {
      position: relative;
      display: block;
      padding: 12px 20px;
      margin: 12px 0;
      color: var(--text-color);
      background: var(--box-bg);
      border: 3px solid transparent;
      border-radius: 14px;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      z-index: 1;
    }

    .menu a::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 16px;
      background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet, red);
      background-size: 400% 400%;
      animation: borderRGB 6s linear infinite;
      z-index: -1;
    }

    @keyframes borderRGB {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #tintedBox {
      background-color: var(--box-bg);
      border-radius: 15px;
      padding: 25px;
      width: 85%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      margin-top: 80px;
      transition: background 0.3s ease;
    }

    #image {
      border-radius: 35%;
      width: 150px;
      height: 150px;
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    #visitButton {
      display: none;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    #visitButton:hover {
      background-color: #0056b3;
    }

    .footer-text {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: var(--text-color);
      font-size: 14px;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 500px) {
      .title {
        font-size: 1.8rem;
        top: 15px;
        left: 15px;
      }
      #tintedBox {
        padding: 20px;
        width: 90%;
      }
      .menu {
        width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="title">TrollStatus</div>

  <div class="menu" id="menu">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
    <a href="#">Home</a>
    <a href="faq-page.html">FAQ</a>
    <a href="credits.html">Credits</a>
    <a href="https://reddit.com/r/jailbreak" target="_blank">r/jailbreak</a>
    <a href="https://ios.cfw.guide" target="_blank">Jailbreak Guide</a>
  </div>

  <div class="menu-btn" onclick="toggleMenu()" id="menuToggle">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div id="tintedBox">
    <h2>Welcome to TrollStatus</h2>
    <img id="image" src="" alt="trollface" />
    <p id="message">Detecting your device...</p>
    <a id="visitButton" href="https://ios.cfw.guide" target="_blank">Visit ios.cfw.guide</a>
  </div>

  <div class="footer-text">Made with ⚡🥤 from Finland</div>

  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        try {
          const userAgent = navigator.userAgent;
          let message = '';
          let showGuideButton = false;

          if (/iPhone|iPad|iPod/.test(userAgent)) {
            const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
            if (match) {
              const major = parseInt(match[1], 10);
              const minor = parseInt(match[2] || 0, 10);
              const patch = parseInt(match[3] || 0, 10);

              if (major === 16 && minor <= 5) {
                message = "Your device is on iOS 16.5 or lower, so it's jailbreak time! Check ios.cfw.guide for instructions.";
                document.getElementById('image').src = 'Trollface.jpg';
                document.getElementById('image').style.display = 'inline';
                showGuideButton = true;
              } else if (major === 16 && minor === 5 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.5.1";
                showGuideButton = true;
              } else if (major === 16 && minor === 6 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.6–16.6.1";
                showGuideButton = true;
              } else if (major === 16 && minor === 7 && patch <= 10) {
                message = "You're on iOS 16.7–16.7.10, which is also jailbreakable if you're using a Checkm8 device!";
                showGuideButton = true;
              } else if (major === 17 && minor === 0) {
                message = "Your device seems to be compatible with TrollStore. Go to ios.cfw.guide for more information.";
                showGuideButton = true;
              } else if (major > 17 || (major === 17 && minor > 0)) {
                message = "Your iOS-version is too new to be jailbroken :(";
              } else {
                message = "Your iOS version is not supported for jailbreak yet.";
              }
            } else {
              message = "Oops! Your device was not recognised.";
            }
          } else {
            message = "You're not using an iOS device!";
          }

          document.getElementById('message').innerText = message;
          document.getElementById('message').style.opacity = 1;
          document.getElementById('visitButton').style.display = showGuideButton ? 'inline-block' : 'none';

        } catch (error) {
          console.error("An error occurred while detecting the iOS version:", error);
          document.getElementById('message').innerText = "An error occurred while detecting your device.";
        }
      }, 1200);
    }

    function toggleTheme() {
      const body = document.body;
      const toggle = document.getElementById('themeToggle');
      const isLight = body.classList.toggle('light');
      toggle.innerText = isLight ? '☀️' : '🌙';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    function applySavedTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light');
        document.getElementById('themeToggle').innerText = '☀️';
      }
    }

    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.classList.toggle('open');
    }

    window.onload = () => {
      detectIOSVersion();
      applySavedTheme();
    };
  </script>
</body>
</html>
