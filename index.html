<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      background: black url('https://www.transparenttextures.com/patterns/dark-mosaic.png');
      color: #00ff00;
      text-shadow: 1px 1px 1px black;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 30px 10px;
      background: #111;
      border-bottom: 4px solid lime;
    }

    .header h1 {
      font-size: 24px;
      color: #00ff00;
      margin: 0;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
      background: #222;
      border-top: 2px solid lime;
      border-bottom: 2px solid lime;
    }

    .nav a {
      color: lime;
      text-decoration: none;
      background: #000;
      padding: 8px 16px;
      border: 2px solid lime;
      display: inline-block;
    }

    .nav a:hover {
      background: lime;
      color: black;
    }

    #tintedBox {
      background-color: #111;
      border: 4px double lime;
      padding: 25px;
      max-width: 600px;
      margin: 40px auto 20px;
      text-align: center;
      box-shadow: 0 0 12px lime;
    }

    .typewriter {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: .15em solid lime;
      animation: typing 3s steps(30, end), blink-caret .75s step-end infinite;
      font-size: 14px;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      0%, 100% { border-color: lime; }
      50% { border-color: transparent; }
    }

    #message {
      margin-top: 20px;
      color: #00ff00;
      font-size: 12px;
    }

    .visit-button-wrapper {
      margin-top: 25px;
    }

    .visit-button {
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: lime;
      border: 2px solid lime;
      padding: 14px 20px;
      text-decoration: none;
      display: inline-block;
      animation: glow 1.2s infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 5px lime, 0 0 10px lime;
      }
      to {
        box-shadow: 0 0 15px lime, 0 0 25px lime;
      }
    }

    .visit-button:hover {
      background: lime;
      color: black;
    }

    .news-section {
      background-color: #111;
      border: 4px dashed lime;
      padding: 20px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 0 10px lime;
    }

    .news-section h2 {
      font-size: 16px;
      color: lime;
      margin-bottom: 15px;
    }

    .news-section p {
      font-size: 12px;
      line-height: 1.5;
      color: #00ff00;
    }

    .footer {
      background: #111;
      color: lime;
      text-align: center;
      padding: 20px;
      border-top: 4px solid lime;
      font-size: 10px;
      margin-top: auto;
      cursor: pointer;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #troll-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: lime;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 20px;
      z-index: 9999;
      overflow: auto;
      white-space: pre;
      animation: blink 0.4s infinite;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>TrollStatus</h1>
  </div>

  <div class="nav">
    <a href="faq-page.html">FAQ</a>
    <a href="credits.html">Credits</a>
    <a href="https://reddit.com/r/jailbreak" target="_blank">Reddit</a>
  </div>

  <div id="tintedBox">
    <h2 class="typewriter">Welcome to TrollStatus</h2>
    <p id="message">Detecting your device...</p>
    <div class="visit-button-wrapper">
      <a class="visit-button" href="https://ios.cfw.guide" target="_blank">Visit ios.cfw.guide</a>
    </div>
  </div>

  <div class="news-section">
    <h2>News</h2>
    <p>July 14, 2025 – TrollStatus got a new coat of paint!</p>
    <p>Stay tuned for updates.</p>
  </div>

  <div class="footer">
    Made in Finland 🇫🇮
  </div>

  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        const userAgent = navigator.userAgent;
        let message = '';
        if (/iPhone|iPad|iPod/.test(userAgent)) {
          const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
          if (match) {
            const major = parseInt(match[1], 10);
            const minor = parseInt(match[2] || 0, 10);
            const patch = parseInt(match[3] || 0, 10);

            if (major === 16 && minor <= 5) {
              message = "iOS 16.5 or lower detected. Jailbreak time!";
            } else if (major === 16 && minor === 5 && patch <= 1) {
              message = "iOS 16.5.1 – NathanLR or Dopamine.";
            } else if (major === 16 && minor === 6 && patch <= 1) {
              message = "iOS 16.6–16.6.1 – Use NathanLR.";
            } else if (major === 16 && minor === 7 && patch <= 10) {
              message = "iOS 16.7–16.7.10 – Checkm8 might work!";
            } else if (major === 17 && minor === 0) {
              message = "iOS 17.0 – Compatible with TrollStore!";
            } else {
              message = "iOS version may not be jailbreakable.";
            }
          } else {
            message = "iOS version not recognized.";
          }
        } else {
          message = "Not an iOS device!";
        }

        document.getElementById('message').innerText = message;
      }, 1000);
    }

    window.onload = detectIOSVersion;

    document.querySelector(".footer").addEventListener("click", () => {

      const troll = document.createElement("div");
      troll.id = "troll-overlay";

⣿⣿⣿⣿⡿⢃⣴⣿⠿⣻⢽⣲⠿⠭⠭⣽⣿⣓⣛⣛⣓⣲⣶⣢⣍⠻⢿⣿⣿
⣿⣿⣿⡿⢁⣾⣿⣵⡫⣪⣷⠿⠿⢿⣷⣹⣿⣿⣿⢲⣾⣿⣾⡽⣿⣷⠈⣿⣿
⣿⣿⠟⠁⣚⣿⣿⠟⡟⠡⠀⠀⠀⠶⣌⠻⣿⣿⠿⠛⠉⠉⠉⢻⣿⣿⠧⡙⢿
⡿⢡⢲⠟⣡⡴⢤⣉⣛⠛⣋⣥⣿⣷⣦⣾⣿⣿⡆⢰⣾⣿⠿⠟⣛⡛⢪⣎⠈
⣧⢸⣸⠐⣛⡁⢦⣍⡛⠿⢿⣛⣿⡍⢩⠽⠿⣿⣿⡦⠉⠻⣷⣶⠇⢻⣟⠟⢀
⣿⣆⠣⢕⣿⣷⡈⠙⠓⠰⣶⣤⣍⠑⠘⠾⠿⠿⣉⣡⡾⠿⠗⡉⡀⠘⣶⢃⣾
⣿⣿⣷⡈⢿⣿⣿⣌⠳⢠⣄⣈⠉⠘⠿⠿⠆⠶⠶⠀⠶⠶⠸⠃⠁⠀⣿⢸⣿

      document.body.appendChild(troll);

      setTimeout(() => {
        troll.remove();
      }, 6000);
    });
  </script>

</body>
</html>
