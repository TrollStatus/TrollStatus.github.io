<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-color: #0a3bc9;
      --bg-color-end: #383a41;
      --text-color: white;
      --box-bg: rgba(255, 255, 255, 0.08);
      --dropdown-bg: rgba(0, 0, 0, 0.85);
    }

    body.light {
      --bg-color: #ffffff;
      --bg-color-end: #e0e0e0;
      --text-color: #111;
      --box-bg: rgba(0, 0, 0, 0.05);
      --dropdown-bg: rgba(255, 255, 255, 0.95);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fira Sans Condensed', sans-serif;
      height: 100vh;
      background: linear-gradient(270deg, var(--bg-color), var(--bg-color-end));
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.5s ease, color 0.5s ease;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2.5rem;
      font-weight: 500;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
    }

    nav {
      position: absolute;
      bottom: 20px;
      left: 20px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      padding: 12px 24px;
      font-size: 16px;
      color: var(--text-color);
      border: none;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      cursor: pointer;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .dropbtn::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border-radius: 30px;
      background: conic-gradient(from 0deg, red, orange, yellow, green, blue, indigo, violet, red);
      z-index: -1;
      animation: borderSpin 5s linear infinite;
      filter: blur(6px);
    }

    @keyframes borderSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 0;
      background-color: var(--dropdown-bg);
      min-width: 160px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      padding: 10px 0;
    }

    .dropdown-content.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .dropdown-content a {
      color: var(--text-color);
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      transition: background 0.2s;
      margin: 4px 0;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    #tintedBox {
      background-color: var(--box-bg);
      border-radius: 15px;
      padding: 25px;
      width: 85%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      margin-top: 80px;
      transition: background 0.3s ease;
    }

    #image {
      border-radius: 35%;
      width: 150px;
      height: 150px;
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .visit-button {
      display: none;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    .visit-button:hover {
      background-color: #0056b3;
    }

    .footer-text {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: var(--text-color);
      font-size: 14px;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="title">TrollStatus</div>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>

  <div id="tintedBox">
    <h2>Welcome to TrollStatus</h2>
    <p id="message">Detecting your device...</p>
    <img id="image" src="" alt="trollface.jpg" />
    <a id="visitButton" href="https://ios.cfw.guide" target="_blank">
      <button class="visit-button">Visit ios.cfw.guide</button>
    </a>
  </div>

  <nav>
    <div class="dropdown">
      <button class="dropbtn" onclick="toggleDropdown()">Menu</button>
      <div id="dropdownMenu" class="dropdown-content">
        <a href="faq-page.html">FAQ</a>
        <a href="credits.html">Credits</a>
        <a href="https://reddit.com/r/jailbreak">r/jailbreak</a>
      </div>
    </div>
  </nav>

  <div class="footer-text">Made with ❤️ from Finland</div>

  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        try {
          const userAgent = navigator.userAgent;
          let message = '';
          let showGuideButton = false;

          if (/iPhone|iPad|iPod/.test(userAgent)) {
            const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
            if (match) {
              const major = parseInt(match[1], 10);
              const minor = parseInt(match[2] || 0, 10);
              const patch = parseInt(match[3] || 0, 10);

              if (major === 16 && minor <= 5) {
                message = "Your device is on iOS 16.5 or lower, so it's jailbreak time! Check ios.cfw.guide for instructions.";
                document.getElementById('image').src = 'Trollface.jpg';
                document.getElementById('image').style.display = 'inline';
                showGuideButton = true;
              } else if (major === 16 && minor === 5 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.5.1";
                showGuideButton = true;
              } else if (major === 16 && minor === 6 && patch <= 1) {
                message = "NathanLR is the recommended tool for you, as you're on iOS 16.6–16.6.1";
                showGuideButton = true;
              } else if (major === 16 && minor === 7 && patch <= 10) {
                message = "You're on iOS 16.7–16.7.10, which is also jailbreakable if you're using a Checkm8 device!";
                showGuideButton = true;
              } else if (major === 17 && minor === 0) {
                message = "Your device seems to be compatible with TrollStore. Go to ios.cfw.guide for more information.";
                showGuideButton = true;
              } else if (major > 17 || (major === 17 && minor > 0)) {
                message = "Your iOS-version is too new to be jailbroken :(";
              } else {
                message = "Your iOS version is not supported for jailbreak yet.";
              }
            } else {
              message = "Oops! Your device was not recognised.";
            }
          } else {
            message = "You're not using an iOS device!";
          }

          document.getElementById('message').innerText = message;
          document.getElementById('message').style.opacity = 1;

          if (showGuideButton) {
            document.getElementById('visitButton').style.display = 'inline-block';
          } else {
            document.getElementById('visitButton').style.display = 'none';
          }

        } catch (error) {
          console.error("An error occurred while detecting the iOS version:", error);
          document.getElementById('message').innerText = "An error occurred while detecting your device.";
        }
      }, 1500);
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('dropdownMenu');
      dropdown.classList.toggle('show');
    }

    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (const d of dropdowns) {
          d.classList.remove('show');
        }
      }
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.classList.toggle('light');
      const toggle = document.getElementById('themeToggle');
      toggle.innerText = current ? '☀️' : '🌙';
      localStorage.setItem('theme', current ? 'light' : 'dark');
    }

    function applySavedTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light');
        document.getElementById('themeToggle').innerText = '☀️';
      }
    }

    window.onload = () => {
      detectIOSVersion();
      applySavedTheme();
    };
  </script>
</body>
</html>
