<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --glow-start: #ff0000;
      --glow-end: #00ff00;
      --menu-bg: rgba(0, 0, 0, 0.6);
      --text-color: white;
      --bg-dark: #0a3bc9;
      --bg-light: #ffffff;
      --text-light: #111;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fira Sans Condensed', sans-serif;
      background: linear-gradient(270deg, var(--bg-dark), #383a41);
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      color: var(--text-color);
      height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body.light {
      background: linear-gradient(270deg, var(--bg-light), #e0e0e0);
      color: var(--text-light);
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-weight: 600;
    }

    
    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 30px;
      height: 24px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bar {
      height: 4px;
      width: 100%;
      background: var(--text-color);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .hamburger.active .bar:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active .bar:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active .bar:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* MENU */
    .menu {
      position: fixed;
      top: 0;
      right: -300px;
      width: 260px;
      height: 100vh;
      background: var(--menu-bg);
      backdrop-filter: blur(15px);
      border-left: 2px solid rgba(255, 255, 255, 0.2);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: right 0.4s ease;
      z-index: 999;
    }

    .menu.show {
      right: 0;
    }

    .theme-toggle {
      font-size: 20px;
      background: none;
      border: none;
      color: var(--text-color);
      margin-bottom: 30px;
      cursor: pointer;
    }

    .menu a {
      position: relative;
      background: #111;
      color: #fff;
      padding: 14px 22px;
      margin-bottom: 15px;
      text-decoration: none;
      border-radius: 40px;
      z-index: 1;
      transition: transform 0.2s ease;
    }

    .menu a::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 40px;
      background: linear-gradient(90deg, var(--glow-start), var(--glow-end), var(--glow-start));
      background-size: 200% 200%;
      filter: blur(8px);
      z-index: -1;
      animation: glow 4s linear infinite;
    }

    @keyframes glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #tintedBox {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    #image {
      margin-top: 20px;
      width: 150px;
      border-radius: 50%;
      display: none;
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
    }

    #visitButton {
      margin-top: 20px;
      padding: 14px 26px;
      background: #111;
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      display: none;
      z-index: 1;
    }

    #visitButton::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 40px;
      background: linear-gradient(90deg, var(--glow-start), var(--glow-end), var(--glow-start));
      background-size: 200% 200%;
      filter: blur(6px);
      z-index: -1;
      animation: glow 4s linear infinite;
    }

    .footer-text {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 13px;
      opacity: 0.7;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 1.5rem;
        top: 15px;
        left: 15px;
      }
      .menu {
        width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="title">TrollStatus</div>

  <div class="hamburger" onclick="toggleMenu()" id="hamburger">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="menu" id="menu">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
    <a href="#">Home</a>
    <a href="faq-page.html">FAQ</a>
    <a href="credits.html">Credits</a>
    <a href="https://reddit.com/r/jailbreak" target="_blank">r/jailbreak</a>
    <a href="https://ios.cfw.guide" target="_blank">Jailbreak Guide</a>
  </div>

  <div id="tintedBox">
    <h2>Welcome to TrollStatus</h2>
    <img id="image" src="Trollface.jpg" alt="Trollface" />
    <p id="message">Detecting your device...</p>
    <a id="visitButton" href="https://ios.cfw.guide" target="_blank">Visit ios.cfw.guide</a>
  </div>

  <div class="footer-text">Made with ⚡🥤 from Finland</div>

  <script>
    function detectIOSVersion() {
      setTimeout(() => {
        const ua = navigator.userAgent;
        const message = document.getElementById('message');
        const image = document.getElementById('image');
        const visitButton = document.getElementById('visitButton');

        let text = "You're not using an iOS device!";
        let showButton = false;

        if (/iPhone|iPad|iPod/.test(ua)) {
          const match = ua.match(/OS (\d+)_?(\d+)?_?(\d+)?/);
          if (match) {
            const major = parseInt(match[1], 10);
            const minor = parseInt(match[2] || 0, 10);
            const patch = parseInt(match[3] || 0, 10);

            if (major === 16 && minor <= 5) {
              text = "Your device is on iOS 16.5 or lower, so it's jailbreak time!";
              image.style.display = 'inline';
              showButton = true;
            } else if (major === 17 && minor <= 0) {
              text = "You can use TrollStore with this version.";
              showButton = true;
            } else {
              text = "Your iOS version is not supported for jailbreak.";
            }
          } else {
            text = "Unable to detect iOS version.";
          }
        }

        message.innerText = text;
        if (showButton) visitButton.style.display = 'inline-block';
      }, 1000);
    }

    function toggleMenu() {
      const menu = document.getElementById('menu');
      const hamburger = document.getElementById('hamburger');
      menu.classList.toggle('show');
      hamburger.classList.toggle('active');
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light');
      document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
    }

    detectIOSVersion();
  </script>
</body>
</html>
