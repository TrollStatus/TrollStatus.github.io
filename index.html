<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrollStatus</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      background: black url('https://www.transparenttextures.com/patterns/dark-mosaic.png');
      color: #00ff00;
      text-shadow: 1px 1px 1px black;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 30px 10px;
      background: #111;
      border-bottom: 4px solid lime;
    }

    .header h1 {
      font-size: 24px;
      color: #00ff00;
      margin: 0;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
      background: #222;
      border-top: 2px solid lime;
      border-bottom: 2px solid lime;
    }

    .nav a {
      color: lime;
      text-decoration: none;
      background: #000;
      padding: 8px 16px;
      border: 2px solid lime;
      display: inline-block;
    }

    .nav a:hover {
      background: lime;
      color: black;
    }

    #tintedBox {
      background-color: #111;
      border: 4px double lime;
      padding: 25px;
      max-width: 600px;
      margin: 40px auto 20px;
      text-align: center;
      box-shadow: 0 0 12px lime;
    }

    .typewriter {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: .15em solid lime;
      animation: typing 3s steps(30, end), blink-caret .75s step-end infinite;
      font-size: 14px;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      0%, 100% { border-color: lime; }
      50% { border-color: transparent; }
    }

    #message {
      margin-top: 20px;
      color: #00ff00;
      font-size: 12px;
    }

    .visit-button-wrapper {
      margin-top: 25px;
    }

    .visit-button {
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: lime;
      border: 2px solid lime;
      padding: 14px 20px;
      text-decoration: none;
      display: inline-block;
      animation: glow 1.2s infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 5px lime, 0 0 10px lime;
      }
      to {
        box-shadow: 0 0 15px lime, 0 0 25px lime;
      }
    }

    .visit-button:hover {
      background: lime;
      color: black;
    }

    .news-section {
      background-color: #111;
      border: 4px dashed lime;
      padding: 20px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 0 10px lime;
    }

    .news-section h2 {
      font-size: 16px;
      color: lime;
      margin-bottom: 15px;
    }

    .news-section p {
      font-size: 12px;
      line-height: 1.5;
      color: #00ff00;
    }

    .footer {
      background: #111;
      color: lime;
      text-align: center;
      padding: 20px;
      border-top: 4px solid lime;
      font-size: 10px;
      margin-top: auto;
      cursor: pointer;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #troll-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: lime;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 20px;
      z-index: 9999;
      overflow: auto;
      white-space: pre;
      animation: blink 0.4s infinite;
    }
  </style>
</head>

  function detectIOSVersion() {
    setTimeout(() => {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      let message = 'Detecting...';

      const isIOS = /iPhone|iPad|iPod/.test(userAgent);
      if (!isIOS) {
        message = "Not an iOS device!";
      } else {
        const match = userAgent.match(/OS (\d+)_?(\d+)?_?(\d+)?/i);
        if (match) {
          const major = parseInt(match[1], 10);
          const minor = parseInt(match[2] || 0, 10);
          const patch = parseInt(match[3] || 0, 10);
          const version = `${major}.${minor}${patch ? "." + patch : ""}`;

          
          if (major === 14) {
            if (minor >= 0 && minor <= 8) {
              message = `iOS ${version} – Taurine jailbreak recommended.`;
            } else {
              message = `iOS ${version} – Skill issue with my coding...`;
            }
          } else if (major === 15 || (major === 16 && minor <= 5)) {
            message = `iOS ${version} – Dopamine jailbreak recommended.`;
          } else if (major === 16 && (minor === 5 && patch === 1 || minor === 6)) {
            message = `iOS ${version} – NathanLR semi-jailbreak recommended (A15/A16 only).`;
          } else if (major === 16 && minor >= 7) {
            message = `iOS ${version} – Palera1n recommended.`;
          } else if (major === 17) {
            if (minor === 0) {
              message = `iOS ${version} – TrollStore compatible.`;
            } else if (minor <= 5) {
              message = `iOS ${version} – No jailbreak`;
            } else {
              message = `iOS ${version} – Jailbreak unavailable.`;
            }
          } else if (major === 18) {
            message = `iOS ${version} – iOS 18 detected. Too early for even dreaming of a jailbreak.`;
          } else {
            message = `iOS ${version} – Unknown or unsupported version.`;
          }
        } else {
          message = "Could not determine iOS version.";
        }
      }

      document.getElementById('message').innerText = message;
    }, 1000);
  }

  window.onload = detectIOSVersion;
